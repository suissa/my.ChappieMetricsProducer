name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build
        run: zig build
      - name: Test
        run: zig build test
      - name: Benchmark (ReleaseFast)
        run: zig build bench
      - name: Verify formatting
        run: test -z "$(zig fmt --check build.zig src/root.zig src/labels.zig bench/atomic_counter.zig)"
